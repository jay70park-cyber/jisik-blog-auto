name: 게시판 구조 탐색 (probe)

# 수동 실행 전용. 화성시 게시판을 읽기만 하고 아무것도 저장하지 않는다.
# collect_hscity.py 가 못 찾은 페이지 넘김 파라미터를 후보 대입으로 찾는다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 탐색 스크립트 생성
        run: |
          mkdir -p /tmp/pb
          cat > /tmp/pb/probe.py <<'PROBE_EOF'
          # -*- coding: utf-8 -*-
          """
          3차 탐색 — 페이징은 풀렸다. 남은 것 둘을 확인한다.

            1) 부서 필터(q_depNm)가 실제로 먹는가
            2) 검색(query)이 먹는가 — 먹으면 현안별로 직접 긁을 수 있다

          풀린 것
            q_cp 와 q_currPage 를 함께 보내야 페이지가 넘어간다.
            q_cp 는 값과 무관하게 '있기만' 하면 된다.
            마지막 페이지는 688 — 전체 약 6,880건.

          읽기만 한다. 아무것도 저장하지 않는다.
          """
          import re
          import html
          import time
          import urllib.parse
          import urllib.request

          BOARD = "https://www.hscity.go.kr/www/gosi/BD_notice.do"
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/120.0 Safari/537.36")

          FORM = {
              "q_cp": "1",
              "q_notAncmtSeCode": "01",
              "q_notAncmtMgtNo": "",
              "q_currPage": "1",
              "sort": "DATE",
              "query": "",
              "q_searchType": "",
              "collection": "",
          }


          def post(overrides, timeout=30):
              params = dict(FORM)
              params.update(overrides)
              body = urllib.parse.urlencode(params).encode("utf-8")
              req = urllib.request.Request(BOARD, data=body, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/xhtml+xml",
                  "Accept-Language": "ko-KR,ko;q=0.9",
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Referer": BOARD,
              })
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as res:
                      return res.read().decode("utf-8", errors="replace")
              except Exception as e:
                  print("    요청 실패: " + str(e))
                  return ""


          def strip_tags(s):
              s = re.sub(r"<[^>]+>", " ", s or "")
              return re.sub(r"\s+", " ", html.unescape(s)).strip()


          def rows_of(page_html):
              out = []
              for m in re.finditer(r"<tr[^>]*>(.*?)</tr>", page_html, re.S | re.I):
                  block = m.group(1)
                  if re.search(r"<th[^>]*>", block, re.I):
                      continue
                  tds = [strip_tags(t) for t in
                         re.findall(r"<td[^>]*>(.*?)</td>", block, re.S | re.I)]
                  if len(tds) >= 4:
                      out.append({"번호": tds[0], "제목": tds[1],
                                  "부서": tds[2], "일자": tds[3]})
              return out


          def last_page(page_html):
              hits = [int(m.group(1)) for m in
                      re.finditer(r"opSearch\((\d+)\)", page_html)]
              return max(hits) if hits else 0


          def main():
              print("=" * 62)
              print("0. 페이징 재확인")
              print("=" * 62)
              p1 = post({"q_currPage": "1"})
              p2 = post({"q_currPage": "2"})
              p50 = post({"q_currPage": "50"})
              r1, r2, r50 = rows_of(p1), rows_of(p2), rows_of(p50)
              print("  1p  {}건  첫 행: {}".format(len(r1), r1[0]["제목"][:42] if r1 else "-"))
              print("  2p  {}건  첫 행: {}".format(len(r2), r2[0]["제목"][:42] if r2 else "-"))
              print("  50p {}건  첫 행: {}".format(len(r50), r50[0]["제목"][:42] if r50 else "-"))
              print("  1p≠2p: {} / 2p≠50p: {}".format(r1 != r2, r2 != r50))
              print("  마지막 페이지: {}".format(last_page(p1)))
              if r50:
                  print("  50p 공고일자: {} ~ {}".format(r50[-1]["일자"], r50[0]["일자"]))

              print("\n" + "=" * 62)
              print("1. 부서 필터 q_depNm 이 먹는가")
              print("=" * 62)
              for dept in ["트램건설추진단", "도시개발과", "없는부서이름12345"]:
                  got = post({"q_depNm": dept})
                  rs = rows_of(got)
                  depts = sorted({r["부서"] for r in rs})
                  ok = len(depts) == 1 and depts[0] == dept
                  print("  {:<16} {}건 / 실제 부서: {}".format(
                      dept, len(rs), ", ".join(depts)[:60]))
                  print("     {} 필터 {}".format("★" if ok else " ", "먹음" if ok else "안 먹음"))
                  time.sleep(0.6)

              print("\n" + "=" * 62)
              print("2. 검색이 먹는가 — 여러 파라미터 이름으로")
              print("=" * 62)
              base = rows_of(p1)
              for key in ["query", "q_query", "q_searchVal", "searchVal",
                          "q_notAncmtNm", "q_notAncmtSj", "q_sj", "q_ttl"]:
                  for stype in ["", "title", "TITLE", "ALL"]:
                      got = post({key: "유통", "q_searchType": stype})
                      rs = rows_of(got)
                      if rs and rs != base:
                          hit = sum(1 for r in rs if "유통" in r["제목"])
                          print("  ★ {:<14} type={!r:<8} {}건 (제목에 '유통' {}건)".format(
                              key, stype, len(rs), hit))
                          if rs:
                              print("       {}".format(rs[0]["제목"][:55]))
                      time.sleep(0.4)
              print("  (★ 가 없으면 검색은 안 먹는 것 — 전체 페이지를 훑어야 한다)")

              print("\n" + "=" * 62)
              print("3. 몇 페이지까지가 최근 3년인가")
              print("=" * 62)
              for p in [1, 50, 100, 150, 200, 300]:
                  got = post({"q_currPage": str(p)})
                  rs = rows_of(got)
                  if not rs:
                      print("  {:>4}p  목록 없음".format(p))
                      break
                  print("  {:>4}p  {} ~ {}".format(p, rs[-1]["일자"], rs[0]["일자"]))
                  time.sleep(0.6)

              print("\n" + "=" * 62)
              print("4. 두 번째 게시판(일반공고)도 같은 방식인가")
              print("=" * 62)
              global BOARD
              BOARD = "https://www.hscity.go.kr/www/gosi/BD_selectGosiList.do"
              g1, g2 = post({"q_currPage": "1"}), post({"q_currPage": "2"})
              a, b = rows_of(g1), rows_of(g2)
              print("  1p {}건 / 2p {}건 / 다름: {}".format(len(a), len(b), a != b))
              print("  마지막 페이지: {}".format(last_page(g1)))
              if a:
                  print("  1p 첫 행: {}".format(a[0]["제목"][:50]))


          if __name__ == "__main__":
              main()
          PROBE_EOF
          python -c "import ast; ast.parse(open('/tmp/pb/probe.py',encoding='utf-8').read()); print('문법 OK')"

      - name: 게시판 탐색
        run: python /tmp/pb/probe.py
