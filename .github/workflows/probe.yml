name: 게시판 구조 탐색 (probe)

# 수동 실행 전용. 화성시 게시판을 읽기만 하고 아무것도 저장하지 않는다.
# collect_hscity.py 가 못 찾은 페이지 넘김 파라미터를 후보 대입으로 찾는다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 탐색 스크립트 생성
        run: |
          mkdir -p /tmp/pb
          cat > /tmp/pb/probe.py <<'PROBE_EOF'
          # -*- coding: utf-8 -*-
          """
          화성시 고시 게시판의 페이지 넘김 파라미터를 찾는다.

          collect_hscity.py 주석에 이렇게 적혀 있다.
              "페이지 필드 이름은 아직 못 찾았으므로, q_currPage 를 같이 보내보고
               1페이지와 결과가 같으면 페이지 넘김이 안 되는 것으로 보고 멈춘다"

          그래서 부서당 10건씩만 쌓였고, 284건으로는 현안 연표가 안 만들어진다.

          사람이 개발자도구로 찾는 대신, 후보 이름을 하나씩 보내보고
          1페이지와 고시번호 목록이 달라지는 것을 찾는다.
          게시판 프레임워크가 쓰는 이름은 몇 개로 정해져 있다.

          읽기만 한다. 아무것도 저장하지 않는다.
          """
          import re
          import html
          import time
          import urllib.parse
          import urllib.request

          BOARD = "https://www.hscity.go.kr/www/gosi/BD_notice.do"

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/120.0 Safari/537.36")

          # 국내 지자체 게시판이 흔히 쓰는 이름들
          # 1차 탐색에서 hidden 필드로 확인된 것들.
          # q_currPage 는 폼에 있는데도 단독으로는 안 먹었다.
          # 서버가 폼 전체를 받아야 판단하는 구조로 보인다.
          FORM_BASE = {
              "q_cp": "",
              "q_notAncmtSeCode": "01",
              "q_notAncmtMgtNo": "",
              "q_currPage": "1",
              "sort": "DATE",
              "query": "",
              "q_searchType": "",
              "collection": "",
          }

          PAGE_KEYS = ["q_cp", "q_currPage", "q_pageIndex", "q_pageNo", "page"]

          # 페이지 대신 '한 번에 많이' 가 되는 경우도 있다
          SIZE_KEYS = ["q_rowPerPage", "q_listScale", "pageSize", "q_pageSize",
                       "rowPerPage", "listScale", "recordCountPerPage"]


          def post(params, timeout=30):
              body = urllib.parse.urlencode(params).encode("utf-8")
              req = urllib.request.Request(BOARD, data=body, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/xhtml+xml",
                  "Accept-Language": "ko-KR,ko;q=0.9",
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Referer": BOARD,
              })
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as res:
                      return res.read().decode("utf-8", errors="replace")
              except Exception as e:
                  print("    요청 실패: " + str(e))
                  return ""


          def get(params=None, timeout=30):
              url = BOARD + ("?" + urllib.parse.urlencode(params) if params else "")
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/xhtml+xml",
                  "Accept-Language": "ko-KR,ko;q=0.9",
              })
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as res:
                      return res.read().decode("utf-8", errors="replace")
              except Exception as e:
                  print("    요청 실패: " + str(e))
                  return ""


          def strip_tags(s):
              s = re.sub(r"<[^>]+>", " ", s or "")
              return re.sub(r"\s+", " ", html.unescape(s)).strip()


          def numbers(page_html):
              """목록에 뜬 고시번호들. 페이지가 넘어갔는지 판별하는 지문."""
              out = []
              for m in re.finditer(r"<tr[^>]*>(.*?)</tr>", page_html, re.S | re.I):
                  block = m.group(1)
                  if re.search(r"<th[^>]*>", block, re.I):
                      continue
                  tds = re.findall(r"<td[^>]*>(.*?)</td>", block, re.S | re.I)
                  if len(tds) >= 4:
                      out.append(strip_tags(tds[0]))
              return [x for x in out if x]


          def first_title(page_html):
              for m in re.finditer(r"<tr[^>]*>(.*?)</tr>", page_html, re.S | re.I):
                  tds = re.findall(r"<td[^>]*>(.*?)</td>", m.group(1), re.S | re.I)
                  if len(tds) >= 4:
                      return strip_tags(tds[1])[:50]
              return ""


          def show_form(page_html):
              """페이지의 form 안 hidden 필드를 보여준다. 정답이 여기 있을 때가 많다."""
              print("\n" + "=" * 58)
              print("페이지 안 hidden 입력 필드")
              print("=" * 58)
              names = re.findall(
                  r'<input[^>]*type=["\']hidden["\'][^>]*>', page_html, re.I)
              seen = set()
              for tag in names:
                  n = re.search(r'name=["\']([^"\']+)["\']', tag, re.I)
                  v = re.search(r'value=["\']([^"\']*)["\']', tag, re.I)
                  if n and n.group(1) not in seen:
                      seen.add(n.group(1))
                      print("  {:<24} = {}".format(n.group(1), (v.group(1) if v else "")[:40]))
              if not seen:
                  print("  (hidden 필드 없음)")

              print("\n" + "=" * 58)
              print("페이지 이동 스크립트 (숫자 링크가 부르는 함수)")
              print("=" * 58)
              # 2페이지 링크가 부르는 자바스크립트를 찾는다
              for m in re.finditer(r"""(?:href|onclick)=["']([^"']*(?:age|Page)[^"']*)["']""",
                                   page_html):
                  s = m.group(1)
                  if "javascript" in s.lower() or "(" in s:
                      print("  " + s[:110])
              # 함수 정의도 함께
              for m in re.finditer(r"function\s+(\w*[Pp]age\w*)\s*\(([^)]*)\)", page_html):
                  print("  function {}({})".format(m.group(1), m.group(2)))


          def try_form(label, overrides, base):
              """폼 전체를 보내고 결과가 1페이지와 달라졌는지 본다."""
              params = dict(FORM_BASE)
              params.update(overrides)
              got = post(params)
              nums = numbers(got)
              if not nums:
                  print("  {:<38} 목록 없음".format(label))
                  return None
              if nums == base:
                  print("  {:<38} 동일".format(label))
                  return None
              print("  {:<38} ★ 달라짐 {}건 | {}".format(
                  label, len(nums), first_title(got)))
              return nums


          def main():
              print("=" * 62)
              print("1페이지 기준 — 폼 전체를 그대로 보낸 결과")
              print("=" * 62)
              base_html = post(FORM_BASE)
              base = numbers(base_html)
              if not base:
                  print("  폼 POST 로는 목록을 못 읽었습니다. GET 으로 기준을 잡습니다.")
                  base_html = get()
                  base = numbers(base_html)
              if not base:
                  print("목록을 못 읽었습니다.")
                  print(base_html[:800])
                  return
              print("  고시번호 {}개".format(len(base)))
              print("  첫 행: {}".format(first_title(base_html)))

              hits = []

              print("\n" + "=" * 62)
              print("A. 폼 전체 + 페이지 값 하나만 2로")
              print("=" * 62)
              for key in PAGE_KEYS:
                  r = try_form("{} = 2".format(key), {key: "2"}, base)
                  if r:
                      hits.append(("폼+" + key, r))
                  time.sleep(0.6)

              print("\n" + "=" * 62)
              print("B. q_cp 와 q_currPage 를 함께")
              print("=" * 62)
              for a, b in [("2", "2"), ("2", "1"), ("1", "2"), ("10", "2"), ("11", "2")]:
                  r = try_form("q_cp={} q_currPage={}".format(a, b),
                               {"q_cp": a, "q_currPage": b}, base)
                  if r:
                      hits.append(("q_cp={} q_currPage={}".format(a, b), r))
                  time.sleep(0.6)

              print("\n" + "=" * 62)
              print("C. q_cp 를 행 오프셋으로 (10, 20 …)")
              print("=" * 62)
              for v in ["0", "10", "11", "20", "21"]:
                  r = try_form("q_cp = {}".format(v), {"q_cp": v}, base)
                  if r:
                      hits.append(("q_cp=" + v, r))
                  time.sleep(0.6)

              print("\n" + "=" * 62)
              print("D. 검색 — query + q_searchType 조합")
              print("=" * 62)
              for st in ["", "title", "TITLE", "subject", "all", "ALL", "1", "0"]:
                  r = try_form("query=유통 q_searchType={!r}".format(st),
                               {"query": "유통", "q_searchType": st}, base)
                  if r:
                      hits.append(("query+q_searchType=" + st, r))
                  time.sleep(0.6)

              print("\n" + "=" * 62)
              print("E. 게시판 구분 q_notAncmtSeCode 바꿔보기")
              print("=" * 62)
              for v in ["02", "03", "00", "10"]:
                  r = try_form("q_notAncmtSeCode = {}".format(v),
                               {"q_notAncmtSeCode": v}, base)
                  if r:
                      hits.append(("q_notAncmtSeCode=" + v, r))
                  time.sleep(0.6)

              print("\n" + "=" * 62)
              print("F. 정렬 바꾸기 — 되면 서버가 폼을 읽고 있다는 증거")
              print("=" * 62)
              for v in ["TITLE", "NUM", "ASC", "DATE_ASC", "RANK"]:
                  r = try_form("sort = {}".format(v), {"sort": v}, base)
                  if r:
                      hits.append(("sort=" + v, r))
                  time.sleep(0.6)

              print("\n" + "=" * 62)
              print("G. 페이지 링크의 실제 HTML — 눈으로 확인")
              print("=" * 62)
              # 페이지 번호가 있는 영역을 통째로 찍는다
              for pat in [r'<div[^>]*(?:paging|pagination|page_wrap|pageing)[^>]*>.*?</div>',
                          r'<ul[^>]*(?:paging|pagination)[^>]*>.*?</ul>',
                          r'<nav[^>]*>.*?</nav>']:
                  for m in re.finditer(pat, base_html, re.S | re.I):
                      seg = re.sub(r"\s+", " ", m.group(0))
                      if len(seg) > 60:
                          print("  " + seg[:1200])
                          print()
                          break

              # 숫자 2가 들어간 앵커 태그를 전부 찾는다
              print("  --- 숫자 링크 태그 ---")
              shown = 0
              for m in re.finditer(r"<a[^>]*>\s*2\s*</a>", base_html, re.I):
                  print("  " + re.sub(r"\s+", " ", m.group(0))[:200])
                  shown += 1
                  if shown >= 3:
                      break
              if not shown:
                  for m in re.finditer(r"<a[^>]{0,200}>", base_html, re.I):
                      tag = m.group(0)
                      if any(w in tag.lower() for w in ["page", "cp=", "next", "다음"]):
                          print("  " + re.sub(r"\s+", " ", tag)[:200])
                          shown += 1
                          if shown >= 8:
                              break
              if not shown:
                  print("  (숫자 링크를 못 찾았습니다 — 스크립트로 그리는 구조일 수 있습니다)")

              print("\n" + "=" * 62)
              print("결과")
              print("=" * 62)
              if hits:
                  for label, nums in hits:
                      print("  ★ {} → {}건 | {}".format(label, len(nums), nums[:2]))
              else:
                  print("  아직 못 찾았습니다. 위 G 섹션의 링크 HTML 을 보내주세요.")


          if __name__ == "__main__":
              main()
          PROBE_EOF
          python -c "import ast; ast.parse(open('/tmp/pb/probe.py',encoding='utf-8').read()); print('문법 OK')"

      - name: 게시판 탐색
        run: python /tmp/pb/probe.py
