name: Collect Hwaseong Notices

on:
  workflow_dispatch:
  schedule:
    # 매주 월요일 07:41 KST
    - cron: '41 22 * * 0'

concurrency:
  group: jisik-blog-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/collect_hscity.py
      - name: Commit notices
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update hscity notices [skip ci]"
          git pull --rebase origin main || true
          git push
