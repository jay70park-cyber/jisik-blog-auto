name: Collect Hwaseong Notices

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: '누적분으로 현안 단계 채우기 (최초 1회만)'
        type: boolean
        default: false
      start_page:
        description: '백필 시작 페이지'
        default: '1'
      end_page:
        description: '백필 끝 페이지'
        default: '60'
  schedule:
    - cron: '10 22 * * *'    # 1차: 07:10 KST
    - cron: '40 0 * * *'     # 백업: 09:40 KST — 1차가 밀리거나 스킵되면 실행

concurrency:
  group: hscity-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      LANG: C.UTF-8
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to run (skip if already ran today)
        id: guard
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          LAST=$(cat state/last_hscity_run_date.txt 2>/dev/null || echo "")
          echo "오늘(KST): $TODAY / 마지막 실행: $LAST / 이벤트: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$LAST" = "$TODAY" ]; then
            echo "오늘 이미 실행되어 건너뜁니다."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Collect
        if: steps.guard.outputs.should_run == 'true'
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python3 scripts/collect_hscity.py --backfill \
              --start=${{ github.event.inputs.start_page || '1' }} \
              --pages=${{ github.event.inputs.end_page || '60' }}
          else
            python3 scripts/collect_hscity.py
          fi

      - name: Collect council minutes
        if: steps.guard.outputs.should_run == 'true' && github.event.inputs.backfill != 'true'
        run: python3 scripts/collect_council.py

      - name: Record run date
        if: steps.guard.outputs.should_run == 'true'
        run: |
          mkdir -p state
          TZ=Asia/Seoul date +%F > state/last_hscity_run_date.txt

      - name: Commit notices
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ state/last_hscity_run_date.txt
          git diff --cached --quiet || git commit -m "Update hscity notices [skip ci]"
          git pull --rebase origin main || true
          git push
