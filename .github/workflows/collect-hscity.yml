name: Collect Hwaseong Notices

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: '누적분으로 현안 단계 채우기 (최초 1회만)'
        type: boolean
        default: false
  schedule:
    - cron: '10 22 * * *'

concurrency:
  group: jisik-blog-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python3 scripts/collect_hscity.py --backfill
          else
            python3 scripts/collect_hscity.py
          fi

      - name: Commit notices
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update hscity notices [skip ci]"
          git pull --rebase origin main || true
          git push
