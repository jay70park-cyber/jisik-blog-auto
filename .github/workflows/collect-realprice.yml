name: Collect Real Price

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '수집 모드'
        required: true
        default: 'backfill'
        type: choice
        options:
          - backfill
          - incremental
      months:
        description: '초기 수집 개월 수 (backfill에서만 사용)'
        required: false
        default: '20'
  schedule:
    # 매월 5일 09:00 KST (UTC 00:00) — 전월 신고분이 어느 정도 반영된 시점
    - cron: '0 0 5 * *'

concurrency:
  group: jisik-blog-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
      COLLECT_MODE: ${{ github.event.inputs.mode || 'incremental' }}
      MONTHS_BACK: ${{ github.event.inputs.months || '20' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run collection script
        run: |
          python3 scripts/collect_realprice.py
          
      - name: Run analysis script
        run: |
          python3 scripts/analyze_realprice.py

      - name: Commit collected data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update real price data [skip ci]"
          git pull --rebase origin main || true
          git push
