name: 지도 키 확인

# 임시 워크플로입니다. 네이버 정적지도 키가 실제로 통하는지
# 확인하고, 통하면 그림 품질까지 눈으로 보려고 만들었습니다.
# 확인이 끝나면 이 파일은 지우세요.

on:
  workflow_dispatch:          # Actions 탭에서 버튼으로만 돈다

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install matplotlib

      - name: 한글 폰트
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: make_map.py 찾기
        id: find
        run: |
          MAP=$(find . -name make_map.py -not -path './.git/*' | head -1)
          if [ -z "$MAP" ]; then echo "make_map.py 를 못 찾았습니다"; exit 1; fi
          echo "찾음: $MAP"
          echo "dir=$(dirname "$MAP")" >> "$GITHUB_OUTPUT"

      - name: 1. 키가 통하는지
        env:
          NCP_MAP_CLIENT_ID: ${{ secrets.NCP_MAP_CLIENT_ID }}
          NCP_MAP_CLIENT_SECRET: ${{ secrets.NCP_MAP_CLIENT_SECRET }}
        working-directory: ${{ steps.find.outputs.dir }}
        run: python make_map.py --probe

      - name: 2. 그림 품질 보기
        if: always()            # 1번이 실패해도 폴백 그림은 보고 싶다
        env:
          NCP_MAP_CLIENT_ID: ${{ secrets.NCP_MAP_CLIENT_ID }}
          NCP_MAP_CLIENT_SECRET: ${{ secrets.NCP_MAP_CLIENT_SECRET }}
        working-directory: ${{ steps.find.outputs.dir }}
        run: python make_map.py

      - name: 그림 내려받기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-probe
          path: |
            **/map_probe.png
            **/map_sample.png
            **/map_line_sample.png
          if-no-files-found: warn
