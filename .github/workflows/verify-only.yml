name: 검증만 다시 돌리기

# 이미 나와 있는 초안(state/draft.md)을 기획안(state/plan.json)과
# 대조해 검증 리포트만 다시 만든다. 초안을 새로 만들지 않으므로
# 안건도 소모하지 않고 본문 생성 비용도 들지 않는다.
#
# 쓰는 때
#   · 검증이 실패해 리포트를 못 받았을 때 (2026-10-12)
#   · verify_draft.py 를 고치고 실제 초안으로 확인하고 싶을 때
#
# 상태 파일을 커밋하지 않는다. 읽기만 하고 리포트는 텔레그램으로 간다.

on:
  workflow_dispatch:
    inputs:
      factcheck:
        description: '사실 확인까지 할지 (0이면 끔 — 토큰 절약)'
        default: '1'

# 본 파이프라인이 도는 중에 끼어들면 반쯤 쓰인 초안을 읽는다.
# 같은 그룹에 넣어 끝날 때까지 기다리게 한다.
concurrency:
  group: jisik-blog-pipeline
  cancel-in-progress: false

env:
  FACTCHECK: ${{ github.event.inputs.factcheck || '1' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 검증할 초안이 있는지
        run: |
          test -f state/draft.md || { echo "state/draft.md 가 없습니다"; exit 1; }
          test -f state/plan.json || { echo "state/plan.json 이 없습니다"; exit 1; }
          echo "초안 $(wc -c < state/draft.md) 바이트"
          head -c 200 state/draft.md; echo

      - name: 검사 항목 수 점검
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/verify_draft.py --check

      - name: 검증
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/verify_draft.py

      - name: 리포트 올려두기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: state/verify_report.txt
          if-no-files-found: warn
