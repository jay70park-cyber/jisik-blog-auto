name: Discover Local Keywords

on:
  workflow_dispatch:
  schedule:
    - cron: '31 22 1,15 * *'   # 매월 1일·15일 07:31 KST

concurrency:
  group: jisik-blog-pipeline
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/discover_local_keywords.py
      - name: Commit keywords
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ state/
          git diff --cached --quiet || git commit -m "Update local keywords [skip ci]"
          git pull --rebase origin main || true
          git push
