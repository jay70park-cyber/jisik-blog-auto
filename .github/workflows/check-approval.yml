name: Check Telegram Approval

on:
  workflow_dispatch:
  schedule:
    # 평상시 15분 주기는 cron-job.org가 담당한다.
    # 여기 예약은 외부 크론이 멈췄을 때를 대비한 백업(시간당 1회)이다.
    - cron: '7 * * * *'

# 두 트리거가 겹쳐 같은 답장을 두 번 처리하거나 state/ 커밋이 충돌하지 않도록
# 한 번에 하나만 실행되게 하고, 뒤에 온 실행은 취소하지 않고 대기시킨다.
concurrency:
  group: check-approval
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          pip install --quiet markdown matplotlib pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum fonts-noto-cjk

      - name: Run approval check script
        run: |
          python3 scripts/check_and_publish.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update approval state [skip ci]"
          git push
