name: 수정 초안 다시 보내기

# state/draft.md 를 새로 쓰지 않고 렌더링·텔레그램 전송만 다시 한다.
# 대화창에서 Claude 가 초안을 고쳐 올렸을 때 쓴다 (2026-11-19 추가).
# 안건을 소모하지 않고 본문 생성 비용도 들지 않는다.
#
# 트리거
#   · state/resend_request.txt 를 고쳐 main 에 올리면 자동 실행
#     (Claude 세션은 workflow_dispatch API 를 못 부른다)
#   · Actions 탭에서 수동 실행

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'state/resend_request.txt'

concurrency:
  group: jisik-blog-pipeline
  cancel-in-progress: false

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      NCP_MAP_CLIENT_ID: ${{ secrets.NCP_MAP_CLIENT_ID }}
      NCP_MAP_CLIENT_SECRET: ${{ secrets.NCP_MAP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          pip install --quiet --timeout 30 --retries 2 markdown matplotlib pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum fonts-noto-cjk

      - name: Render and send
        run: python3 scripts/resend_draft.py

      - name: Commit state
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Resend draft state [skip ci]"
          git pull --rebase origin main || true
          git push || true
