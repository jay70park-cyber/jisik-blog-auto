name: Test Naver DataLab API

on:
  workflow_dispatch:

jobs:
  test-datalab:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Query search trend for keyword group
        run: |
          python3 -c "import json; json.dump({'startDate':'2026-07-01','endDate':'2026-08-04','timeUnit':'week','keywordGroups':[{'groupName':'지식산업센터','keywords':['지식산업센터','동탄 지식산업센터']}]}, open('body.json','w',encoding='utf-8'), ensure_ascii=False)"

          echo "----- 요청 바디 -----"
          cat body.json

          curl -sS --connect-timeout 10 --max-time 20 -X POST "https://naverapihub.apigw.ntruss.com/datalab/v1/search" -H "X-NCP-APIGW-API-KEY-ID: ${{ secrets.NAVER_CLIENT_ID }}" -H "X-NCP-APIGW-API-KEY: ${{ secrets.NAVER_CLIENT_SECRET }}" -H "Content-Type: application/json" -d @body.json -o response.json -w "HTTP_STATUS:%{http_code}\n"

          echo "----- 원본 응답 -----"
          cat response.json

          python3 -c "import json; d=json.load(open('response.json', encoding='utf-8')); r=d['results'][0] if d.get('results') else None; last=r['data'][-1] if r and r.get('data') else None; s=('최근 주간 검색량 지수: ' + str(last['ratio'])) if last else ('오류: ' + str(d)); open('summary.txt','w',encoding='utf-8').write(s)"

          echo "----- 요약 -----"
          cat summary.txt

          SUMMARY=$(cat summary.txt)
          curl -sS --connect-timeout 10 --max-time 20 -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode "text=네이버 데이터랩 API 테스트: $SUMMARY"
