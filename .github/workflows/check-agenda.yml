name: 현안 연결 점검

# 읽기만 한다. 고시도 현안도 바꾸지 않는다.
# 키워드나 지역 필터를 고친 뒤, 기존 고시가 어느 현안에 붙는지
# 확인할 때 쓴다. 본체(collect_hscity)는 새로 올라온 고시만
# 현안에 연결하므로 기존 것은 이 워크플로로만 다시 볼 수 있다.

on:
  workflow_dispatch:
    inputs:
      agenda:
        description: '한 현안만 볼 때 id 또는 현안명 (비우면 전체)'
        default: ''
      grep:
        description: "낱말이 든 고시를 모두 볼 때 (예: 일반산업단지). 넣으면 이것만 한다"
        default: ''

# 파이썬이 import 할 때 __pycache__ 를 만든다. 데이터 변경이 아닌데
# 읽기 전용 확인에 걸린다. 아예 안 만들게 한다.
env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 점검
        run: |
          if [ -n "${{ github.event.inputs.grep }}" ]; then
            python3 -B scripts/check_agenda_match.py --grep "${{ github.event.inputs.grep }}"
          else
            python3 -B scripts/check_agenda_match.py "${{ github.event.inputs.agenda }}"
          fi

      - name: 데이터가 안 바뀌었는지
        run: |
          # 추적 중인 파일만 본다. 캐시 같은 부산물은 세지 않는다.
          DIRTY=$(git status --porcelain --untracked-files=no)
          if [ -n "$DIRTY" ]; then
            echo "::error::읽기 전용이어야 하는데 데이터가 바뀌었습니다"
            echo "$DIRTY"
            exit 1
          fi
          echo "데이터 변경 없음 — 읽기만 했습니다"
