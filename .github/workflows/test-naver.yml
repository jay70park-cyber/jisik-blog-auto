name: Test Naver API

on:
  workflow_dispatch:

jobs:
  test-naver:
    runs-on: ubuntu-latest
    steps:
      - name: Search Naver Blog for test keyword
        run: |
          RESULT=$(curl -s -X GET "https://naverapihub.apigw.ntruss.com/search/v1/blog?query=지식산업센터&display=3&format=json" \
            -H "X-NCP-APIGW-API-KEY-ID: ${{ secrets.NAVER_CLIENT_ID }}" \
            -H "X-NCP-APIGW-API-KEY: ${{ secrets.NAVER_CLIENT_SECRET }}")
          echo "$RESULT"

          FIRST_TITLE=$(echo "$RESULT" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d['items'][0]['title'] if d.get('items') else ('오류: ' + str(d)))" | sed 's/<[^>]*>//g')

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="네이버 검색 API 테스트: $FIRST_TITLE"
