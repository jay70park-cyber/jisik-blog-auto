name: 발행일 원고 보내기

# scheduled/YYYY-MM-DD_*.md 를 그 날짜 아침 텔레그램으로 보낸다 (2026-11-25 추가).
# 파이프라인 밖에서 쓴 원고(업체 DB 분기 글 등)용. state/ 는 건드리지 않는다.
# 보낼 것이 없는 날은 1분 안에 끝난다.

on:
  schedule:
    - cron: '40 23 * * *'   # 매일 08:40 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scheduled/*.md'      # 날짜가 지난 원고를 올리면 바로 보낸다

concurrency:
  group: scheduled-posts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      NCP_MAP_CLIENT_ID: ${{ secrets.NCP_MAP_CLIENT_ID }}
      NCP_MAP_CLIENT_SECRET: ${{ secrets.NCP_MAP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Anything due today?
        id: due
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          N=0
          for f in scheduled/*.md; do
            [ -e "$f" ] || continue
            d=$(basename "$f" | cut -c1-10)
            [[ "$d" < "$TODAY" || "$d" == "$TODAY" ]] && N=$((N+1))
          done
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "오늘 $TODAY — 보낼 원고 $N건"

      - name: Install Python dependencies
        if: steps.due.outputs.count != '0'
        run: |
          pip install --quiet --timeout 30 --retries 2 markdown matplotlib pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum fonts-noto-cjk

      - name: Render and send
        if: steps.due.outputs.count != '0'
        run: python3 scripts/send_scheduled_posts.py

      - name: Commit moved files
        if: steps.due.outputs.count != '0'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A scheduled/
          git diff --cached --quiet || git commit -m "Scheduled post sent [skip ci]"
          git pull --rebase origin main || true
          git push || true
