name: Weekly Source Collection

on:
  workflow_dispatch:
  schedule:
    # 정각은 전 세계 작업이 몰려 지연/스킵되므로 분을 어긋나게 잡는다.
    # 1차: 월·목 08:17 KST = UTC 23:17 (일·수)
    - cron: '17 23 * * 0,3'
    # 백업: 월·목 11:23 KST = UTC 02:23 (월·목) — 1차가 스킵되면 여기서 실행
    - cron: '23 2 * * 1,4'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decide whether to run (skip if already ran today)
        id: guard
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          LAST=$(cat state/last_run_date.txt 2>/dev/null || echo "")
          echo "오늘(KST): $TODAY / 마지막 실행: $LAST / 이벤트: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$LAST" = "$TODAY" ]; then
            echo "오늘 이미 실행되어 건너뜁니다."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Python dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: |
          pip install --quiet markdown matplotlib pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum fonts-noto-cjk

      - name: Run collection script
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python3 scripts/collect_sources.py

      - name: Send collection summary to Telegram
        if: steps.guard.outputs.should_run == 'true'
        run: |
          MESSAGE=$(cat telegram_message.txt)
          curl -sS --connect-timeout 10 --max-time 20 -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode "text=$MESSAGE"

      - name: Generate draft with Claude and send to Telegram
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python3 scripts/generate_draft.py

      - name: Upload results as artifact
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: collection-and-draft
          path: |
            collection_result.json
            draft.html
            state/thumbnail.png

      - name: Record run date
        if: steps.guard.outputs.should_run == 'true'
        run: |
          mkdir -p state
          TZ=Asia/Seoul date +%F > state/last_run_date.txt

      - name: Commit state for approval tracking
        if: steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update weekly draft state [skip ci]"
          git push
