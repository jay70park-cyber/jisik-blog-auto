name: Weekly Source Collection

on:
  workflow_dispatch:
  schedule:
    # 매주 월요일, 목요일 오전 8시(KST) = UTC 23:00(일/수)
    - cron: '0 23 * * 0,3'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run collection script
        run: |
          python3 scripts/collect_sources.py

      - name: Send collection summary to Telegram
        run: |
          MESSAGE=$(cat telegram_message.txt)
          curl -sS --connect-timeout 10 --max-time 20 -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode "text=$MESSAGE"

      - name: Generate draft with Claude and send to Telegram
        run: |
          python3 scripts/generate_draft.py

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection-and-draft
          path: |
            collection_result.json
            draft.md

      - name: Commit state for approval tracking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update weekly draft state [skip ci]"
          git push
