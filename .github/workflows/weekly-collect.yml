name: Weekly Source Collection

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run collection script
        run: |
          python3 scripts/collect_sources.py

      - name: Send summary to Telegram
        run: |
          MESSAGE=$(cat telegram_message.txt)
          curl -sS --connect-timeout 10 --max-time 20 -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode "text=$MESSAGE"

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection-result
          path: collection_result.json
